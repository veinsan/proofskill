# B-05: the ProofSkill API on Render, as a Blueprint (Render dashboard: New > Blueprint > this repo).
# Every secret is `sync: false`: Render asks for its value in the dashboard, so it never lives in
# this file or in git. The seed-only secrets (SUPABASE_SERVICE_ROLE_KEY, SEED_PASSWORD) and the
# Etherscan key stay off the server.
services:
  - type: web
    name: proofskill-api
    runtime: python
    plan: free  # sleeps when idle and wakes in about 30 seconds (PRD, Deployment decisions)
    region: singapore  # same region as the Supabase project
    rootDir: api
    buildCommand: pip install uv==0.13.7 && uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/openapi.json  # existing route; no new endpoint (B-05)
    envVars:
      # Build with Render's Python (3.13 from api/.python-version), not a uv-downloaded one that
      # would live outside the project directory and be missing at runtime.
      - key: UV_PYTHON_PREFERENCE
        value: only-system
      - key: CHAIN_RPC_URL
        value: https://sepolia.base.org
      - key: REGISTRY_DEPLOYMENT  # relative to api/
        value: ../contracts/deployments/baseSepolia.json
      - key: DATABASE_URL  # Supabase session pooler URI with ?sslmode=require
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: REGISTRY_OWNER_KEY  # OD-12 custodial default: the platform admin's testnet key
        sync: false
      - key: ISSUER_KEY_ISS_001
        sync: false
      - key: ISSUER_KEY_ISS_002
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEB_BASE_URL  # the Vercel URL once B-06 deploys the web app
        sync: false
