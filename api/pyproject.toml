[project]
name = "proofskill-api"
version = "0.1.0"
description = "ProofSkill REST API (/api/v1), one module per SoaML service"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "psycopg>=3.3.9",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
